name: First Workflow for React
on: 
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
jobs:
  first-workflow-react:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        node-version: 24
        cache: npm 

    - name: install dependencies
      run: npm ci

    - name: make react build
      run: npm run build
