name: Pull Request Workflow for React
on:
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
jobs:
  first-workflow-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
